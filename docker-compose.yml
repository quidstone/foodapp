version: "3.9"

services:
  db:
    image: postgres:16
    container_name: foodapp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fooduser
      POSTGRES_PASSWORD: foodpass
      POSTGRES_DB: fooddb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodapp_api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: fooduser
      POSTGRES_PASSWORD: foodpass
      POSTGRES_DB: fooddb
      PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  db_data:
