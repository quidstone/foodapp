services:
  db:
    image: postgres:16
    container_name: foodapp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fooduser
      POSTGRES_PASSWORD: foodpass
      POSTGRES_DB: fooddb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fooduser -d fooddb"]
      interval: 5s
      timeout: 5s
      retries: 10

  etl:
    build:
      context: ./ETL
      dockerfile: Dockerfile
    container_name: foodapp_etl
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: fooduser
      POSTGRES_PASSWORD: foodpass
      POSTGRES_DB: fooddb
      RESTAURANTS_JSON: restaurant_with_menu.json
      USERS_JSON: users_with_purchase_history.json

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodapp_api
    restart: unless-stopped
    depends_on:
      - db
      - etl
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: fooduser
      POSTGRES_PASSWORD: foodpass
      POSTGRES_DB: fooddb
      PORT: "8080"
      ENABLE_CACHE: "true"
    ports:
      - "8080:8080"

volumes:
  db_data:
